name: Интерфейс DUS Leads на GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/pages.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Проверить адрес backend
        env:
          API_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          if [[ "$API_URL" != https://* ]]; then
            echo 'Добавьте HTTPS-адрес backend в Settings > Secrets and variables > Actions > Variables: VITE_API_BASE_URL'
            exit 1
          fi
      - run: npm ci
        working-directory: frontend
      - name: Собрать интерфейс
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          if [[ "$REPO_NAME" == *.github.io ]]; then
            export VITE_BASE_PATH=/
          else
            export VITE_BASE_PATH="/$REPO_NAME/"
          fi
          npm run build
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - name: Опубликовать
        id: deploy
        uses: actions/deploy-pages@v4
